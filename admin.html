<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E6DCEC">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="robots" content="noindex">
  <title>Panel barbero — Feryza Barber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/main.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

  <header class="app-header">
    <div class="app-header-inner">
      <div class="brand">
        <img class="brand-logo" src="assets/logo-light.png" alt="Feryza Barber" width="42" height="42">
        <div>
          <div>FERYZA BARBER</div>
          <div class="brand-sub">Panel del barbero</div>
        </div>
      </div>
      <a class="header-back" href="index.html">Reservas</a>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-login" id="adminLogin">
      <h1 class="admin-title">Acceso</h1>
      <p class="admin-sub">Ingresa el PIN para ver y gestionar las citas</p>
      <form class="admin-pin-form" id="pinForm" autocomplete="off">
        <label class="field" for="adminPin">
          <span>PIN</span>
          <input type="password" id="adminPin" inputmode="text" placeholder="••••••••" maxlength="32" required>
          <span class="field-error" id="pinError"></span>
        </label>
        <button type="submit" class="btn-continue" id="btnPin">Entrar</button>
      </form>
    </section>

    <section class="admin-panel hidden" id="adminPanel">
      <div class="admin-toolbar">
        <div>
          <h1 class="admin-title">Agenda</h1>
          <p class="admin-sub" id="adminCount">Cargando…</p>
        </div>
        <div class="admin-toolbar-actions">
          <button type="button" class="btn-sec admin-btn-sm" id="btnCalDay">Día</button>
          <button type="button" class="btn-sec admin-btn-sm" id="btnCalWeek">Semana</button>
          <button type="button" class="btn-sec admin-btn-sm" id="btnRefresh" aria-label="Actualizar">Actualizar</button>
          <button type="button" class="btn-sec admin-btn-sm" id="btnLogout">Salir</button>
        </div>
      </div>
      <div class="admin-config-warn hidden" id="configWarn">
        Ejecuta <code>supabase/hardening.sql</code> en el SQL Editor de Supabase para cerrar el acceso público a los datos de clientes.
      </div>
      <div class="admin-cal-nav">
        <button type="button" class="cal-nav" id="adminCalPrev" aria-label="Anterior">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="admin-cal-label" id="adminCalLabel"></div>
        <button type="button" class="cal-nav" id="adminCalNext" aria-label="Siguiente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button type="button" class="btn-sec admin-btn-sm" id="btnCalToday">Hoy</button>
      </div>
      <div id="bookingsList" class="admin-calendar"></div>
    </section>

    <div class="admin-sheet hidden" id="adminSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <button type="button" class="admin-sheet-backdrop" id="sheetClose" aria-label="Cerrar"></button>
      <div class="admin-sheet-panel">
        <div id="sheetBody"></div>
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="scripts/admin.js"></script>
</body>
</html>
